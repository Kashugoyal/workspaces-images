name: Build and Push CUDA Jammy DIND Image

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'dockerfile-kasm-cuda-jammy-dind'
      - 'src/ubuntu/install/dind/**'
      - 'src/ubuntu/install/tools/**'
      - 'src/ubuntu/install/misc/**'
      - 'src/ubuntu/install/chrome/**'
      - 'src/ubuntu/install/chromium/**'
      - 'src/ubuntu/install/sublime_text/**'
      - 'src/ubuntu/install/vs_code/**'
      - 'src/ubuntu/install/cleanup/**'
      - 'src/common/**'
      - '.github/workflows/build-cuda-jammy-dind.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'dockerfile-kasm-cuda-jammy-dind'
      - 'src/ubuntu/install/dind/**'
      - 'src/ubuntu/install/tools/**'
      - 'src/ubuntu/install/misc/**'
      - 'src/ubuntu/install/chrome/**'
      - 'src/ubuntu/install/chromium/**'
      - 'src/ubuntu/install/sublime_text/**'
      - 'src/ubuntu/install/vs_code/**'
      - 'src/ubuntu/install/cleanup/**'
      - 'src/common/**'
      - '.github/workflows/build-cuda-jammy-dind.yml'
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'Base image tag'
        required: false
        default: 'develop'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kasm-cuda-jammy-dind

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}

    - name: Set BASE_TAG
      id: base-tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.base_tag }}" ]; then
          echo "BASE_TAG=${{ github.event.inputs.base_tag }}" >> $GITHUB_ENV
        else
          echo "BASE_TAG=develop" >> $GITHUB_ENV
        fi

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./dockerfile-kasm-cuda-jammy-dind
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BASE_TAG=${{ env.BASE_TAG }}
          BASE_IMAGE=core-cuda-jammy
        platforms: linux/amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate summary
      run: |
        echo "## 🐳 Docker Image Built Successfully" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** \`${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Base Image:** \`kasmweb/core-cuda-jammy:${{ env.BASE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 How to pull and run:" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
        echo "docker run --rm -it --privileged -p 6901:6901 ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY